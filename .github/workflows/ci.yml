name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, architecture, test, build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installs the pnpm version pinned in package.json ("packageManager").
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm lint:arch
      - run: pnpm test
      - run: pnpm build

  docker:
    name: Docker image builds, starts and stops gracefully
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - run: docker build --tag express-module-first-template:ci .

      - name: Start the container and wait for /health
        run: |
          docker run --detach --name app --publish 3000:3000 express-module-first-template:ci
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://localhost:3000/health; then exit 0; fi
            sleep 1
          done
          docker logs app
          exit 1

      - name: Stop it with SIGTERM and expect a clean exit
        run: |
          docker stop --time 15 app
          docker logs app
          test "$(docker inspect --format '{{.State.ExitCode}}' app)" = "0"
